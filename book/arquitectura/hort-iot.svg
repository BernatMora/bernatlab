<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- ========== DEFINICIONS ========== -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf8f3"/>
      <stop offset="100%" stop-color="#f3efe5"/>
    </linearGradient>

    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>

    <!-- Fletxes amb colors per fase -->
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8702c"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a4a8c"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a6a8c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a7d44"/>
    </marker>
    <marker id="arr-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6a3c"/>
    </marker>

    <!-- Patrons de fons per fase -->
    <pattern id="pat-orange" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#fdf3e8"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#c8702c" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <pattern id="pat-purple" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f3ecf6"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#7a4a8c" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <pattern id="pat-blue" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#eaf1f6"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#3a6a8c" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <pattern id="pat-green" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#eaf2ec"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#3a7d44" stroke-width="0.5" opacity="0.15"/>
    </pattern>

    <!-- Icona fulla (sensor) -->
    <symbol id="leaf" viewBox="0 0 40 40">
      <path d="M 20 4 Q 36 12, 32 28 Q 26 36, 14 34 Q 4 28, 8 14 Q 14 6, 20 4 Z" fill="#3a7d44" stroke="#2a5d34" stroke-width="1"/>
      <path d="M 20 4 Q 20 18, 14 34" stroke="#2a5d34" stroke-width="0.8" fill="none"/>
    </symbol>

    <!-- Icona antena LoRa -->
    <symbol id="antena" viewBox="0 0 40 40">
      <line x1="20" y1="4" x2="20" y2="36" stroke="#7a4a8c" stroke-width="2.5"/>
      <circle cx="20" cy="14" r="3" fill="#7a4a8c"/>
      <path d="M 8 18 Q 20 10, 32 18" stroke="#7a4a8c" stroke-width="1.5" fill="none"/>
      <path d="M 4 24 Q 20 12, 36 24" stroke="#7a4a8c" stroke-width="1.5" fill="none" opacity="0.7"/>
      <path d="M 2 30 Q 20 16, 38 30" stroke="#7a4a8c" stroke-width="1.5" fill="none" opacity="0.4"/>
      <rect x="14" y="36" width="12" height="3" fill="#5a5a55"/>
    </symbol>
  </defs>

  <!-- ========== FONS ========== -->
  <rect width="1200" height="720" fill="url(#bg2)"/>

  <!-- ========== TITOL ========== -->
  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#2a2a25">Hort Osona — Arquitectura IoT i Flux de Dades</text>
  <text x="600" y="62" text-anchor="middle" font-size="14" fill="#7a7a75">Sensor → LoRa 868 MHz → Gateway → MQTT → InfluxDB → Grafana / Web pública</text>
  <line x1="40" y1="80" x2="1160" y2="80" stroke="#c4bfae" stroke-width="1"/>

  <!-- ========== FILA 1: SENSORS (taronja) ========== -->
  <g>
    <rect x="40" y="105" width="240" height="230" rx="10" fill="url(#pat-orange)" stroke="#c8702c" stroke-width="2" filter="url(#shadow2)"/>
    <text x="160" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#c8702c">1. Sensors al camp</text>
    <text x="160" y="148" text-anchor="middle" font-size="11" fill="#7a4a2c">Hort Osona · 245 m de casa</text>

    <!-- Sensor MiFlora 1 -->
    <g transform="translate(70, 175)">
      <rect x="0" y="0" width="180" height="55" rx="6" fill="#ffffff" stroke="#c8702c" stroke-width="1.5"/>
      <use href="#leaf" x="10" y="10" width="35" height="35"/>
      <text x="55" y="20" font-size="12" font-weight="600" fill="#3a3a35">MiFlora #1</text>
      <text x="55" y="35" font-size="10" fill="#5a5a55">tomàquets · 4 testos</text>
      <text x="55" y="48" font-size="9" fill="#7a7a75">humitat, llum, T, fertilitat</text>
    </g>

    <!-- Sensor MiFlora 2 -->
    <g transform="translate(70, 245)">
      <rect x="0" y="0" width="180" height="55" rx="6" fill="#ffffff" stroke="#c8702c" stroke-width="1.5"/>
      <use href="#leaf" x="10" y="10" width="35" height="35"/>
      <text x="55" y="20" font-size="12" font-weight="600" fill="#3a3a35">MiFlora #2</text>
      <text x="55" y="35" font-size="10" fill="#5a5a55">enciams · 2 testos</text>
      <text x="55" y="48" font-size="9" fill="#7a7a75">humitat, llum, T, fertilitat</text>
    </g>
  </g>

  <!-- ========== FILA 1: COMUNICACIÓ LORA (lila) ========== -->
  <g>
    <rect x="310" y="105" width="240" height="230" rx="10" fill="url(#pat-purple)" stroke="#7a4a8c" stroke-width="2" filter="url(#shadow2)"/>
    <text x="430" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#7a4a8c">2. Ràdio LoRa 868 MHz</text>
    <text x="430" y="148" text-anchor="middle" font-size="11" fill="#5a3a6c">SX1262 · modulació sub-GHz</text>

    <!-- Mòdul SX1262 -->
    <g transform="translate(330, 175)">
      <rect x="0" y="0" width="200" height="125" rx="6" fill="#ffffff" stroke="#7a4a8c" stroke-width="1.5"/>
      <use href="#antena" x="80" y="10" width="40" height="40"/>
      <text x="100" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3a35">Mòdul SX1262</text>
      <text x="100" y="85" text-anchor="middle" font-size="10" fill="#5a5a55">868 MHz · 14 dBm</text>
      <text x="100" y="100" text-anchor="middle" font-size="10" fill="#5a5a55">SPI / USB · P2P o LoRaWAN</text>
      <text x="100" y="115" text-anchor="middle" font-size="9" fill="#7a7a75" font-style="italic">245 m amb arbres al mig</text>
    </g>
  </g>

  <!-- ========== FILA 1: GATEWAY / RPi (blau) ========== -->
  <g>
    <rect x="580" y="105" width="280" height="230" rx="10" fill="url(#pat-blue)" stroke="#3a6a8c" stroke-width="2" filter="url(#shadow2)"/>
    <text x="720" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#3a6a8c">3. Gateway LoRa → MQTT</text>
    <text x="720" y="148" text-anchor="middle" font-size="11" fill="#2a4a6c">Raspberry Pi · ChirpStack / Python</text>

    <!-- Gateway box -->
    <g transform="translate(600, 175)">
      <rect x="0" y="0" width="240" height="135" rx="6" fill="#ffffff" stroke="#3a6a8c" stroke-width="1.5"/>
      <text x="120" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3a35">RPi 4 — Receptor LoRa</text>
      <line x1="20" y1="32" x2="220" y2="32" stroke="#c4bfae" stroke-width="0.8"/>

      <!-- RX/TX mòdul -->
      <rect x="20" y="42" width="200" height="28" rx="3" fill="#e8f0f5" stroke="#3a6a8c" stroke-width="1"/>
      <text x="120" y="60" text-anchor="middle" font-size="11" font-weight="600" fill="#3a3a35">RX/TX SX1262 (SPI)</text>

      <!-- Script Python -->
      <rect x="20" y="76" width="200" height="28" rx="3" fill="#e8f0f5" stroke="#3a6a8c" stroke-width="1"/>
      <text x="120" y="94" text-anchor="middle" font-size="11" font-weight="600" fill="#3a3a35">lora-receiver.py</text>

      <!-- MQTT publish -->
      <rect x="20" y="110" width="200" height="20" rx="3" fill="#fdf3e8" stroke="#c8702c" stroke-width="1"/>
      <text x="120" y="124" text-anchor="middle" font-size="10" font-weight="600" fill="#c8702c">→ publish MQTT</text>
    </g>
  </g>

  <!-- ========== FILA 1: DADES / BACKEND (verd) ========== -->
  <g>
    <rect x="890" y="105" width="270" height="230" rx="10" fill="url(#pat-green)" stroke="#3a7d44" stroke-width="2" filter="url(#shadow2)"/>
    <text x="1025" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#3a7d44">4. Dades i Visualització</text>
    <text x="1025" y="148" text-anchor="middle" font-size="11" fill="#2a5d34">InfluxDB · Grafana · Web pública</text>

    <!-- Mosquitto -->
    <g transform="translate(910, 175)">
      <rect x="0" y="0" width="230" height="40" rx="4" fill="#ffffff" stroke="#3a7d44" stroke-width="1.2"/>
      <text x="115" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#3a3a35">Mosquitto (broker MQTT)</text>
      <text x="115" y="32" text-anchor="middle" font-size="10" fill="#5a5a55">tòpics: hort/sensors/+/+</text>
    </g>

    <!-- Telegraf -->
    <g transform="translate(910, 222)">
      <rect x="0" y="0" width="230" height="40" rx="4" fill="#ffffff" stroke="#3a7d44" stroke-width="1.2"/>
      <text x="115" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#3a3a35">Telegraf (consumer)</text>
      <text x="115" y="32" text-anchor="middle" font-size="10" fill="#5a5a55">MQTT → InfluxDB</text>
    </g>

    <!-- InfluxDB -->
    <g transform="translate(910, 269)">
      <rect x="0" y="0" width="230" height="55" rx="4" fill="#ffffff" stroke="#3a7d44" stroke-width="1.5"/>
      <text x="115" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#3a7a44">InfluxDB 2.x (TSDB)</text>
      <text x="115" y="36" text-anchor="middle" font-size="10" fill="#5a5a55">bucket: hort-osona</text>
      <text x="115" y="50" text-anchor="middle" font-size="9" fill="#7a7a75">30 dies raw · 5 anys agregat</text>
    </g>
  </g>

  <!-- ========== FILA 2: VISUALITZACIÓ (verd) ========== -->
  <g>
    <rect x="40" y="370" width="600" height="180" rx="10" fill="url(#pat-green)" stroke="#3a7d44" stroke-width="2" filter="url(#shadow2)"/>
    <text x="340" y="395" text-anchor="middle" font-size="15" font-weight="700" fill="#3a7d44">5. Visualització (interna)</text>
    <text x="340" y="412" text-anchor="middle" font-size="11" fill="#2a5d34">Grafana · Node-RED · alertes</text>

    <!-- Grafana -->
    <g transform="translate(60, 430)">
      <rect x="0" y="0" width="260" height="105" rx="6" fill="#ffffff" stroke="#3a7d44" stroke-width="1.5"/>
      <text x="130" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#3a7a44">Grafana</text>
      <text x="130" y="40" text-anchor="middle" font-size="10" fill="#5a5a55">dashboards hort-osona</text>
      <line x1="20" y1="50" x2="240" y2="50" stroke="#c4bfae" stroke-width="0.8"/>
      <text x="20" y="68" font-size="10" fill="#3a3a35">• gràfica humitat/test</text>
      <text x="20" y="84" font-size="10" fill="#3a3a35">• comparatiu entre tests</text>
      <text x="20" y="100" font-size="10" fill="#3a3a35">• alertes llindar</text>
    </g>

    <!-- Node-RED -->
    <g transform="translate(340, 430)">
      <rect x="0" y="0" width="280" height="105" rx="6" fill="#ffffff" stroke="#3a7d44" stroke-width="1.5"/>
      <text x="140" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#3a7a44">Node-RED</text>
      <text x="140" y="40" text-anchor="middle" font-size="10" fill="#5a5a55">automatitzacions i flux</text>
      <line x1="20" y1="50" x2="260" y2="50" stroke="#c4bfae" stroke-width="0.8"/>
      <text x="20" y="68" font-size="10" fill="#3a3a35">• si humitat &lt; 30% → alerta</text>
      <text x="20" y="84" font-size="10" fill="#3a3a35">• filtratge de lectures</text>
      <text x="20" y="100" font-size="10" fill="#3a3a35">• publicació a API pública</text>
    </g>
  </g>

  <!-- ========== FILA 2: WEB PÚBLICA (marró) ========== -->
  <g>
    <rect x="670" y="370" width="490" height="180" rx="10" fill="#f5efe0" stroke="#8a6a3c" stroke-width="2" filter="url(#shadow2)"/>
    <text x="915" y="395" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6a3c">6. Web pública Hort Osona</text>
    <text x="915" y="412" text-anchor="middle" font-size="11" fill="#5a4a2c">https://bernatmora.github.io/hort-osona/</text>

    <!-- API FastAPI -->
    <g transform="translate(690, 430)">
      <rect x="0" y="0" width="200" height="105" rx="6" fill="#ffffff" stroke="#8a6a3c" stroke-width="1.5"/>
      <text x="100" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3a35">FastAPI</text>
      <text x="100" y="38" text-anchor="middle" font-size="10" fill="#5a5a55">REST API pública</text>
      <line x1="20" y1="48" x2="180" y2="48" stroke="#c4bfae" stroke-width="0.8"/>
      <text x="20" y="65" font-size="10" fill="#3a3a35">• GET /api/sensors</text>
      <text x="20" y="80" font-size="10" fill="#3a3a35">• GET /api/readings</text>
      <text x="20" y="95" font-size="10" fill="#3a3a35">• JSON o CSV</text>
    </g>

    <!-- Web GitHub Pages -->
    <g transform="translate(910, 430)">
      <rect x="0" y="0" width="230" height="105" rx="6" fill="#ffffff" stroke="#8a6a3c" stroke-width="1.5"/>
      <text x="115" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#3a3a35">GitHub Pages</text>
      <text x="115" y="38" text-anchor="middle" font-size="10" fill="#5a5a55">web estàtica HTML/CSS/JS</text>
      <line x1="20" y1="48" x2="210" y2="48" stroke="#c4bfae" stroke-width="0.8"/>
      <text x="20" y="65" font-size="10" fill="#3a3a35">• gràfiques actuals</text>
      <text x="20" y="80" font-size="10" fill="#3a3a35">• taula lectures</text>
      <text x="20" y="95" font-size="10" fill="#3a3a35">• visió global de l'hort</text>
    </g>
  </g>

  <!-- ========== LLEGENDA (a baix a l'esquerra) ========== -->
  <g transform="translate(40, 570)">
    <rect x="0" y="0" width="1120" height="120" rx="10" fill="#ffffff" stroke="#c4bfae" stroke-width="1" filter="url(#shadow2)"/>
    <text x="20" y="25" font-size="13" font-weight="700" fill="#3a3a35">Llegenda — colors per fase del flux de dades</text>

    <!-- Fase 1 -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="22" height="22" rx="3" fill="url(#pat-orange)" stroke="#c8702c" stroke-width="1.5"/>
      <text x="32" y="15" font-size="11" font-weight="600" fill="#c8702c">Sensors</text>
      <text x="32" y="28" font-size="9" fill="#5a5a55">MiFlora BLE/BT</text>
    </g>

    <!-- Fase 2 -->
    <g transform="translate(160, 40)">
      <rect x="0" y="0" width="22" height="22" rx="3" fill="url(#pat-purple)" stroke="#7a4a8c" stroke-width="1.5"/>
      <text x="32" y="15" font-size="11" font-weight="600" fill="#7a4a8c">Ràdio LoRa</text>
      <text x="32" y="28" font-size="9" fill="#5a5a55">868 MHz · llarg abast</text>
    </g>

    <!-- Fase 3 -->
    <g transform="translate(320, 40)">
      <rect x="0" y="0" width="22" height="22" rx="3" fill="url(#pat-blue)" stroke="#3a6a8c" stroke-width="1.5"/>
      <text x="32" y="15" font-size="11" font-weight="600" fill="#3a6a8c">Gateway + MQTT</text>
      <text x="32" y="28" font-size="9" fill="#5a5a55">RPi + ChirpStack</text>
    </g>

    <!-- Fase 4 -->
    <g transform="translate(500, 40)">
      <rect x="0" y="0" width="22" height="22" rx="3" fill="url(#pat-green)" stroke="#3a7d44" stroke-width="1.5"/>
      <text x="32" y="15" font-size="11" font-weight="600" fill="#3a7d44">Emmagatzematge</text>
      <text x="32" y="28" font-size="9" fill="#5a5a55">InfluxDB TSDB</text>
    </g>

    <!-- Fase 5 -->
    <g transform="translate(680, 40)">
      <rect x="0" y="0" width="22" height="22" rx="3" fill="url(#pat-green)" stroke="#3a7d44" stroke-width="1.5"/>
      <text x="32" y="15" font-size="11" font-weight="600" fill="#3a7d44">Visualització</text>
      <text x="32" y="28" font-size="9" fill="#5a5a55">Grafana + Node-RED</text>
    </g>

    <!-- Fase 6 -->
    <g transform="translate(860, 40)">
      <rect x="0" y="0" width="22" height="22" rx="3" fill="#f5efe0" stroke="#8a6a3c" stroke-width="1.5"/>
      <text x="32" y="15" font-size="11" font-weight="600" fill="#8a6a3c">Web pública</text>
      <text x="32" y="28" font-size="9" fill="#5a5a55">API + GitHub Pages</text>
    </g>

    <!-- Línia de temps -->
    <line x1="20" y1="100" x2="1100" y2="100" stroke="#c4bfae" stroke-width="1"/>
    <g font-size="10" fill="#7a7a75">
      <text x="80" y="115" text-anchor="middle">1. Sensors</text>
      <text x="270" y="115" text-anchor="middle">2. LoRa 868 MHz</text>
      <text x="460" y="115" text-anchor="middle">3. Gateway + MQTT</text>
      <text x="650" y="115" text-anchor="middle">4. InfluxDB TSDB</text>
      <text x="820" y="115" text-anchor="middle">5. Grafana / Node-RED</text>
      <text x="1010" y="115" text-anchor="middle">6. Web pública</text>
    </g>
  </g>

  <!-- ========== CONNEXIONS (fletxes amb colors) ========== -->
  <!-- 1 → 2 (sensors emeten via radio) -->
  <line x1="280" y1="235" x2="310" y2="235" stroke="#c8702c" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text x="295" y="225" text-anchor="middle" font-size="9" font-weight="600" fill="#c8702c">lectura</text>

  <!-- 2 → 3 (LoRa → RPi) -->
  <line x1="550" y1="235" x2="580" y2="235" stroke="#7a4a8c" stroke-width="2.5" marker-end="url(#arr-purple)"/>
  <text x="565" y="225" text-anchor="middle" font-size="9" font-weight="600" fill="#7a4a8c">paquet</text>

  <!-- 3 → 4 (MQTT publish) -->
  <line x1="860" y1="235" x2="890" y2="235" stroke="#3a6a8c" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="875" y="225" text-anchor="middle" font-size="9" font-weight="600" fill="#3a6a8c">MQTT</text>

  <!-- 4 (InfluxDB) → 5 (Grafana) — consulta -->
  <path d="M 1025 325 Q 1025 360, 600 360 Q 340 360, 340 425" fill="none" stroke="#3a7d44" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="640" y="355" font-size="10" font-weight="600" fill="#3a7d44">consulta (Flux / InfluxQL)</text>

  <!-- 4 (InfluxDB) → 6 (FastAPI) — dades per API -->
  <path d="M 1025 325 Q 1025 360, 800 360 Q 790 360, 790 425" fill="none" stroke="#8a6a3c" stroke-width="2" marker-end="url(#arr-brown)"/>
  <text x="900" y="355" font-size="10" font-weight="600" fill="#8a6a3c">JSON / CSV</text>

  <!-- 5 (Node-RED) → 6 (API pública) — automatització publica -->
  <path d="M 620 480 Q 660 480, 690 480" fill="none" stroke="#3a7d44" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="655" y="473" text-anchor="middle" font-size="9" font-style="italic" fill="#3a7d44">push</text>

  <!-- ========== PEU ========== -->
  <text x="600" y="710" text-anchor="middle" font-size="10" fill="#8a8a85" font-style="italic">BernatLab · Hort Osona — Capítols 13, 15, 17, 19, 23, 25 del llibre</text>
</svg>
